<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="960" viewBox="0 0 1800 960">
  <title>Deep Online Correction for Monocular Visual Odometry</title>
  <desc>Reconstruction results and error maps sit above the depth and pose pipeline. Short vertical arrows connect the error maps with warping. Gray arrows show the forward computation and red arrows show correction feedback.</desc>
  <defs>
    <image id="pipeline" width="2193" height="676" xlink:href="doc-source-0.png" />
    <image id="reconstruction" width="1712" height="1149" xlink:href="doc-source-1.png" />
    <marker id="forward-arrow" markerWidth="32" markerHeight="32" refX="29" refY="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 30 15 0 30Z" fill="#888" /></marker>
    <marker id="feedback-arrow" markerWidth="32" markerHeight="32" refX="29" refY="15" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 30 15 0 30Z" fill="#d00000" /></marker>
  </defs>
  <rect width="1800" height="960" fill="white" />
<svg x="40" y="480" width="1480" height="475" viewBox="20 175 1510 485" preserveAspectRatio="xMinYMin meet"><use xlink:href="#pipeline" /></svg>
  <path d="M1390 515 V465" stroke="#888" stroke-width="7" fill="none" stroke-linejoin="round" marker-end="url(#forward-arrow)" />
  <path d="M1440 465 V515" stroke="#d00000" stroke-width="7" fill="none" stroke-linejoin="round" marker-end="url(#feedback-arrow)" />
  <svg x="40" y="20" width="680" height="448" viewBox="40 45 1640 1080" preserveAspectRatio="xMinYMin meet"><use xlink:href="#reconstruction" /></svg>
  <svg x="1110" y="120" width="600" height="326" viewBox="1690 255 470 255" preserveAspectRatio="xMidYMid meet"><use xlink:href="#pipeline" /></svg>
  <g font-family="Arial, sans-serif" font-size="26" fill="#535b52">
    <path d="M1170 75 H1250" stroke="#888" stroke-width="7" marker-end="url(#forward-arrow)" /><text x="1270" y="84">Forward computation</text>
    <path d="M1170 120 H1250" stroke="#d00000" stroke-width="7" marker-end="url(#feedback-arrow)" /><text x="1270" y="129">Correction feedback</text>
  </g>
</svg>